name: build-and-publish
on:
  push:
    tags:
      - 'v*'   # 例如推送 v1.0.0 时触发

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 启用 OIDC Token
      contents: read    # 读取仓库内容

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/MyProject.csproj

      - name: Build
        run: dotnet build --no-restore -c Release ./src/MyProject.csproj

      - name: Pack
        run: dotnet pack -c Release ./src/MyProject.csproj -o ./artifacts

      # 登录并获取临时 API Key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Hakoyu   # NuGet.org 用户名

      # 推送到 NuGet.org
      - name: NuGet push
        run: dotnet nuget push ./artifacts/*.nupkg \
             --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
             --source https://api.nuget.org/v3/index.json \
             --skip-duplicate
